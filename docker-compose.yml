services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shreyansir_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-online_exam}
      DB_USER: ${DB_USER:-exam_user}
      DB_PASS: ${DB_PASS:-exam_password}
      BASE_URL: ${BASE_URL:-}
      IMAGE_STORAGE_DRIVER: ${IMAGE_STORAGE_DRIVER:-local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-questions}
    volumes:
      - ./:/var/www/html
      - uploads_data:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: mariadb:10.11
    container_name: shreyansir_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret}
      MARIADB_DATABASE: ${DB_NAME:-online_exam}
      MARIADB_USER: ${DB_USER:-exam_user}
      MARIADB_PASSWORD: ${DB_PASS:-exam_password}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"${MARIADB_ROOT_PASSWORD:-root_secret}\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: shreyansir_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: shreyansir_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - app_network

volumes:
  db_data:
    name: shreyansir_db_data
  uploads_data:
    name: shreyansir_uploads_data

networks:
  app_network:
    name: shreyansir_app_network
    driver: bridge
